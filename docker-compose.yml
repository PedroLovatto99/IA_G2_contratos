services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "python -u -m rag.ingestao_dados && uvicorn app:app --host 0.0.0.0 --port 8000"
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - chroma_dados:/app/rag/chromadb
      - modelos_hf:/root/.cache/huggingface

volumes:
  chroma_dados:
  modelos_hf:
